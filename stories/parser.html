…

Glistening Ward took a deep breath as she got to the infirmary to start her shift. She’d noticed the more significant quantity of puppets around, including a fair number of Anchorages and Praetors in particular. She tried not to disturb any on her way into the infirmary, looking at one of the other nurses. “What’s going on? I’ve never seen this many puppets around,” She asked.

Ward gently laid a hoof on Hyacinth’s side, trying to ground them. “I’m right here. You’ll be okay. Just focus here and now,” She expressed gently.
Hyacinth blinked slowly. Their body fought them as they tried to relax. Their breathing grew deeper, but not slower, as they tried to wrest control from their instincts. They pressed one of their hooves hard into the cot, enough to audibly buckle some of the springs beneath. They grit their teeth, and another contraction rang through them.

One of the other nurses called out: “I’m seeing hooves!”
Ward perked up. “It won’t be long now. Just follow your heart, your Highness,” She expressed, pacing down their body to help with delivery.
A number of nurses were gathered around Hyacinth’s abdomen. The first sightings of one of the foals were true to the nurse’s word, as a pair of hooves poked out first. The next push bore a snout, still wrapped in amniotic sac. The nurses waited, but new better than to reach out and pull.

Ward was almost one of them, but she got ahold of herself. Hyacinth needed her right now. She gripped the sac tightly, pulling it taut around the foal to keep the open wound closed. It wasn’t perfect, but it would hold for now. “Okay, okay, it’s alright… The foals are both out, that’s the hard part,” She told herself steadfastly, despite the panic of holding a half-mangled foal setting into her.

Allium looked up and slowly opened her eyes. She moved her metal leg around a bit, with surprising dexterity. She seemed satisfied, slumping back against Hyacinth.
Hyacinth chuckled. “Not much of a talker at all,” They murmured softly, leaning down to gently kiss the top of Allium’s head.
The affection drew Solace’s attention, who now jealously waggled her legs at Hyacinth. Her tongue poked out of her mouth, and she whined.
Hyacinth giggled gently. “Alright, dear. You too,” They said softly, placing a gentle kiss on Solace’s head, before tilting up to kiss the side of Cardion’s as well. “And one for big sister.”
Cardion jumped a little, but nuzzled into Hyacinth.

Solace reached up and poked Hyacinth’s chin, sticking her tongue out again.
Hyacinth giggled. “She takes after her other mother,” They commented softly. “Never ashamed of being the center of attention.”
Cardion smiled a bit, but paused. “What… What was the other mother like?” She asked, looking at Hyacinth.
Hyacinth smiled gently, stroking Solace’s head to placate her as they considered the question. “She was…” They trailed off. “I’m not really sure where to start. She was very much a socialite; more than I could ever be. It didn’t matter if it was sorting the court or just spending time with loved ones; being around others was her element. It trickled into everything she did: She’d take any opportunity to spend time outside or out and about. She was quite excited to meet someone ‘new’ when we first met; I suppose she was old enough that anything new was rare for her,” Hyacinth commented, rubbing their chin. “We bonded over wanting the best for our kin. She had been caring for ponies for a long time, and I was about twenty years into tending to your siblings then. I suppose what caught me by surprise was how much she enjoyed listening; understanding what made us different. I believe it all fed back into being a novelty for her,” They admitted.

Cardion blinked once or twice. “How did mothers meet?” She asked, tilting her head.
Hyacinth looked down at Solace and Allium, who had once again settled down. “That might just be long enough for a bedtime story…” They conceded, rubbing their neck. “It was quite a long time ago. I was much younger then, of course: only in my thirties at most. I had struck out on my own when your siblings started coming along; we had found a nice spot in a large wetland, where wet-soil plants like flax grew plentifully. We were a small troupe back then: No more than a hundred of us, even including grandchildren. We didn’t have the variety back then, either. No titans, not even superheavies. I was the largest of any of us by a substantial margin.”

“We grew there for… Five, maybe six years. We had some unsavoury neighbors: creatures known as changelings would raid us now and then, hoping to take advantage of us. We learned quite quickly how to protect ourselves; Praetors came about during that time,” Hyacinth continued. “The attacks made us wary of visitors, despite my attempts at staying optimistic. When Celestia touched down near the edge of our farm the first time, I approached her only once I was escorted by a pair of Praetors. I believe she had experience with stern royalty… She bowed to me when I first saw her. I had never been bowed to before, up until that point, and I hadn’t had any particular practice with speaking formally,” Hyacinth conceded. “Though I must say, I will never forget her expression when I offered my hand for a shake,” They chuckled behind said hand.

“She was very disarming,” Hyacinth admitted. “Though perhaps I was eager to just have a guest. I had her come inside, we made some bread and dandelion tea, and just… Talked. She asked me the basic questions: How long I’d been out there, who my allegiance was to. I remember explaining to her the basics of our kin; how I was the closest thing we had to a ruler. For as outgoing as she was, she always listened carefully when I tried to explain ourselves to her,” They smiled fondly. “I suppose that’s what always stuck out to me about our first meeting: How mundane it really was, in hindsight. Two new friends meeting for tea, striking up a conversation.”

Cardion nodded. “Did mothers fall in love right away?” She asked.
Hyacinth chuckled. “I was quite oblivious to how much she enjoyed our time together. We had known each other for close to a century when it finally clicked that she wanted to bring our ties deeper than that of friends or diplomats,” They conceded, rubbing their neck. “We had gone out to Rainbow Falls; it was her preferred place to go to empty her head. While we sat there, staring at the falls, I heard her just barely over the roar of the water: She told me that she loved me. I can’t say I fully understood at first… I had only ever felt familial love for most of my life. It only really clicked into place the second after I told her I loved her back,” They commented. “I had never seen her cry before that day, after ninety seven years of being there for each other through thick and thin… I think it all came out that evening. I just remember holding her until she could pull herself together long enough to set the sun,” Hyacinth smiled bittersweetly, blinking their wet eyes a few times.

Cardion leaned in and hugged her mother with her unoccupied front leg. “That… Sounds like a long time to wait for love,” She expressed. “This one does not know if this would last that long.”
Hyacinth rubbed their neck, sniffling a bit. “Haha… That’s the nature of the beast sometimes. You have to choose, between being patient, or being bold,” They admitted. “For all her social outgoingness, she was patient to a fault during our quiet time… I think eventually it became too much for her to keep to herself after such a long time.”
Cardion nodded, looking down at Allium, still in her front legs. “Thos one does not seem very patient.”
Allium, without opening her eyes, tilted her head up and stuck her tongue out at Cardion.
Hyacinth laughed a bit. “Give her time. She isn’t even a day old yet,” They expressed, nuzzling both Cardion and Solace.

Ward poked in through the door, looking at the family. “Are you four okay in here?” She asked.
Hyacinth looked over at Ward with a smile. “Oh, yes. I was just telling Cardion about her other mother,” They commented. “You’re welcome to come in, dear.”
Ward hesitated a little, but stepped inside, shutting the door behind her. “I didn’t mean to intrude, your highness,” She expressed. “I guess I’m just a bit on edge after this morning.”
Hyacinth nodded. “I think it’s all shaken out alright. These two seem happy enough, at least,” They expressed.
Ward nodded, looking up at Solace as the large foal turned to look at her. She gave a nervous smile. “Hi…” She greeted softly. “Aren’t you just a cutie?” She asked, trying to make a good impression.
Solace stuck her tongue out with a soft ‘pbbt’, blinking a couple times.
Hyacinth giggled. “She’s a rambunctious one, be careful,” They commented.

Cardion lowered Solace a bit as Ward came closer, so they were some approximation of eye level.
Ward looked over Solace, taking in the foal’s appearance. Her eyes followed the messy curls of Solace’s multicolored mane. “She certainly got Celestia’s mane…” Ward murmured.
Solace blinked a couple times, tongue still poking out of her mouth.
“She got the hair and the personality, from what I’ve seen,” Hyacinth giggled. “We will have to be cautious with making sure she doesn’t wander off.”
Ward nodded. “She has Cardion’s eyes,” She mused. “No pupils, just irises. But it seems like she can see just fine,” She pondered.
“This one can see,” Cardion nodded. “So can the others, and those ones have even less eye parts.”

Ward nodded, rubbing her chin. “I guess that makes sense, though how your eyes work is kind of a mystery to us. If one of you has eye problems, I’m not sure if we’ll be able to help,” She admitted.
“I’m sure you’ll figure something out if necessary, dear,” Hyacinth commented with a small smile. “Though to my knowledge, none of my children have any sort of vision issues. Even the Leviathan can see just fine,” They mused.
“That’s good,” Ward commented, before snapping out of her musings. “Oh- but, I don’t want to take away from your time with the foals. We can discuss childcare another time,” She expressed.
Hyacinth smiled. “The appointments are a good excuse to clear a morning, at least,” They commented with a soft chuckle. “I suspect I’ll want a bit more free time now that these two are here.”
“I’ll try to get some notes ready,” Ward commented. “I can’t really write you off of replacing the sun, but I can probably get you out of a few meetings,” She added with a giggle.
“Every bit helps,” Hyacinth supposed with a small smile.

Ward nodded, her gaze drifting to the other foal. “Is Allium okay?” She asked. “It was… Kind of a shock when the Serfs started operating on her. I’m glad they knew what they were doing.”
“Oh, she’s all right, dear,” Hyacinth replied gently. “She seems to be the quiet one out of the two, but she doesn’t seem to be in any sort of major discomfort,” They expressed, rubbing the mechanized filly’s head.
Allium blew a puff of air through her lips, but didn’t turn to acknowledge the nurse.
Ward just giggled. “Seems like she’s a little sassy, too,” She commented, rubbing her chin. “Have either of them spoken yet?” She asked curiously.
“Not yet,” Hyacinth admitted. “Though Cardion’s been able to check in mentally with Allium, so I suspect it’s only a matter of time,” They commented.
“I guess it makes sense. They can probably learn from you and all the others if they’re connected,” Ward mused.

“I believe so,” Hyacinth nodded, tapping their chin in thought. “Though if they are like Cardion, it will take some time. She is still fully adjusting to her abilities; the rest of my children are born fully capable and learned of their full potential,” They commented.
Ward closed her eyes for a moment. “That makes sense, on some level,” She commented as she looked back up at Hyacinth. “Different parts of the body age at different rates; the brain takes the longest of anything to fully develop, and even after that point it’s still consistently rearranging itself. Cardion has more to process mentally than the others, so it makes sense she’d take the longest to grow,” Ward mused.
Hyacinth nodded. “I suppose that follows logic, given Cardion has more control over the others than any of them do,” They commented. “It is a role she is still growing into, in addition to getting used to speaking to those not of our kin.”

Ward nodded. “It’s something to keep an eye on,” She supposed. “I… Should probably get back to helping out the other nurses, if you’re all doing okay. I just wanted to check in and make sure the four of you were doing okay,” She expressed.
Hyacinth smiled. “It’s appreciated, dear. I think we’ll be around for often for a while, just to make sure Solace and Allium are growing healthily,” They expressed.
Ward smiled. “Of course, your highness. I’ll help any way I can,” She expressed, before tilting her head lower to look at Solace and Allium. “You two be good for mama, now,” She expressed.
Solace waved her hooves at Ward and whined a little, while Allium just puffed softly and snuggled closer to Hyacinth.
Hyacinth smiled gently, kissing Solace’s head. “We’ll come see the doctor again soon, dear,” They promised. “We need to get some rest, now.”
Solace whined a little more, flopping dramatically against Cardion’s chest and closing her eyes.
Ward giggled. “Such a little drama queen,” She chided playfully as she turned to leave. “Have a good rest, you four,” She expressed softly.
“Bye bye,” Cardion replied softly, leaning against Hyacinth and closing her eyes.
“Thank you, dear. Take care of yourself,” Hyacinth bade, giving a small wave.

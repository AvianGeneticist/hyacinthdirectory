            var output = `<p>`

            // We leave text relatively unadulterated (default). This is mostly to replace docs' angle quotes and replace newlines with html-appropriate characters.
            // Ellipses are also parsed via a nested if statement, as I use them to indicate linebreaks in the doc form. Otherwise, they're replaced with three periods.
            for(i = 0; i <= (inputtext.length-1); i++) {
                switch (inputtext[i]) {
                    case "…":
                        if (inputtext[i-1] == "\n") {
                            output += `<hr style="height:2px;border-width:0;color:rgba(214,145,210,0.6);background-color:rgba(214,145,210,0.6)">\n`
                        } else {
                            output += `...`
                        }
                        
                    break;
                    case "“":
                        output += `"`
                    break;
                    case "”":
                        output += `"`
                    break;
                    case "‘":
                        output += "'"
                    break;
                    case "’":
                        output += "'"
                    break;
                    case "\n":
                        if (inputtext[i-1] != "\n" && inputtext[i-1] != "…") {
                            output += "</p>\n"
                        }
                        if (inputtext[i+1] == "\n") {
                            output += "<br>\n"
                        }
                        if (inputtext[i+1] != "\n" && inputtext[i+1] != "…") {
                            // I don't like this, but if I don't nest my ifs like this it duplicates every <p>
                            // and doesn't get rid of the one at the end of the document.
                            if (i+1 != inputtext.length) {
                                output += "<p>"
                            }
                        }
                    break;
                    default:
                        output += inputtext[i]
                }
            }
            console.log(output)
            document.querySelector('div').innerHTML = output
